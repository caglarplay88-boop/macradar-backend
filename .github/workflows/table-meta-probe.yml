name: Table Metadata Probe

on:
  push:
    paths:
      - '.github/workflows/table-meta-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe FotMob table metadata
        shell: bash
        run: |
          node - <<'NODE'
          const H={
            'user-agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/149 Mobile Safari/537.36',
            'accept':'application/json,text/plain,*/*',
            'referer':'https://www.fotmob.com/'
          };
          const r=await fetch('https://www.fotmob.com/api/data/teams?id=8198&ccode3=DEU',{headers:H});
          console.log('HTTP',r.status);
          const j=await r.json();
          function walk(o,p='root'){
            if(!o||typeof o!=='object')return;
            if(Array.isArray(o)&&o.length>=10){
              const sample=o.slice(0,3);
              const s=JSON.stringify(sample);
              if(/points|pts|rank|position|played|qual|releg|champ|europ/i.test(s)){
                console.log('ARRAY',p,'LEN',o.length,JSON.stringify(sample).slice(0,12000));
              }
            }
            if(Array.isArray(o)) o.forEach((v,i)=>walk(v,p+'['+i+']'));
            else for(const [k,v] of Object.entries(o)) if(v&&typeof v==='object') walk(v,p+'.'+k);
          }
          walk(j);
          NODE
