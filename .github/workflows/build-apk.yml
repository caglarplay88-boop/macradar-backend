name: Build MacRadar APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.macradar --project-name macradar mobile_build
          cp mobile/lib/main.dart mobile_build/lib/main.dart
          cd mobile_build
          flutter pub add http shared_preferences flutter_local_notifications workmanager firebase_core firebase_messaging

      - name: Configure optional Firebase
        env:
          FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_B64" ]; then
            echo "Firebase config not present; continuing without FCM."
            exit 0
          fi

          cd mobile_build
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json

          grep -q 'com.google.gms.google-services' android/settings.gradle.kts ||             sed -i '0,/plugins {/s//plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false/' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/app/build.gradle.kts ||             sed -i '0,/plugins {/s//plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

          test -s android/app/google-services.json
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/app/build.gradle.kts

      - name: Set app name and internet permission
        run: |
          sed -i 's/android:label="macradar"/android:label="MacRadar"/' mobile_build/android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/macradar_icon"#' mobile_build/android/app/src/main/AndroidManifest.xml

          # Dedicated PCM WAV for the high-importance Dropping channel.
          mkdir -p mobile_build/android/app/src/main/res/raw
          python3 - <<'PYSOUND'
          import math, struct, wave

          rate = 44100
          segments = [
              (880, 0.18),
              (0, 0.06),
              (1175, 0.18),
              (0, 0.06),
              (1568, 0.28),
              (0, 0.08),
              (1175, 0.16),
              (1568, 0.32),
          ]

          frames = []
          for frequency, duration in segments:
              count = max(1, int(rate * duration))
              for i in range(count):
                  if frequency == 0:
                      sample = 0
                  else:
                      attack = min(1.0, i / max(1, int(rate * 0.012)))
                      release = min(1.0, (count - i - 1) / max(1, int(rate * 0.025)))
                      envelope = max(0.0, min(attack, release))
                      fundamental = math.sin(2.0 * math.pi * frequency * i / rate)
                      harmonic = 0.28 * math.sin(4.0 * math.pi * frequency * i / rate)
                      sample = int(0.78 * 32767 * envelope * (fundamental + harmonic) / 1.28)
                  frames.append(struct.pack('<h', sample))

          path = 'mobile_build/android/app/src/main/res/raw/dropping_alert.wav'
          with wave.open(path, 'wb') as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(rate)
              output.writeframes(b''.join(frames))
          PYSOUND

          mkdir -p mobile_build/android/app/src/main/res/drawable
          python3 - <<'PY'
          import struct, zlib, math

          W=192
          H=192
          bg=(19,35,26,255)
          gold=(255,200,87,255)
          white=(242,245,243,255)
          dark=(19,35,26,255)

          px=[[bg for _ in range(W)] for _ in range(H)]

          def put(x,y,c):
              if 0 <= x < W and 0 <= y < H:
                  px[y][x]=c

          def circle(cx,cy,r,c):
              rr=r*r
              for y in range(cy-r,cy+r+1):
                  for x in range(cx-r,cx+r+1):
                      if (x-cx)*(x-cx)+(y-cy)*(y-cy) <= rr:
                          put(x,y,c)

          def line(x0,y0,x1,y1,width,c):
              dx=x1-x0; dy=y1-y0
              steps=max(abs(dx),abs(dy),1)
              for i in range(steps+1):
                  t=i/steps
                  x=round(x0+dx*t); y=round(y0+dy*t)
                  circle(x,y,width,c)

          # Rising/falling odds line
          pts=[(24,126),(58,92),(87,108),(126,66),(157,84)]
          for a,b in zip(pts,pts[1:]):
              line(a[0],a[1],b[0],b[1],5,gold)

          # Arrow head
          line(157,84,145,73,4,gold)
          line(157,84,143,90,4,gold)

          # Football badge
          circle(137,133,30,white)
          circle(137,133,10,dark)
          for ang in [0,72,144,216,288]:
              rad=math.radians(ang)
              x=int(137+20*math.cos(rad))
              y=int(133+20*math.sin(rad))
              circle(x,y,5,dark)
              line(137,133,x,y,2,dark)

          raw=bytearray()
          for row in px:
              raw.append(0)
              for r,g,b,a in row:
                  raw.extend((r,g,b,a))

          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)

          png=b"\x89PNG\r\n\x1a\n"
          png+=chunk(b'IHDR',struct.pack(">IIBBBBB",W,H,8,6,0,0,0))
          png+=chunk(b'IDAT',zlib.compress(bytes(raw),9))
          png+=chunk(b'IEND',b'')
          open("mobile_build/android/app/src/main/res/drawable/macradar_icon.png","wb").write(png)
          PY
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' mobile_build/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' mobile_build/android/app/src/main/AndroidManifest.xml
          sed -i '/sourceCompatibility = JavaVersion./a\        isCoreLibraryDesugaringEnabled = true' mobile_build/android/app/build.gradle.kts
          cat >> mobile_build/android/app/build.gradle.kts <<'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          EOF

          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' mobile_build/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          cd mobile_build
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee /tmp/macradar-flutter-build.log; then
            tail -80 /tmp/macradar-flutter-build.log | sed 's/%/%25/g' | sed 's/^/::error::/'
            exit 1
          fi

      - name: Verify Dropping notification resources
        run: |
          python3 - <<'PYVERIFY'
          import io
          import wave
          import zipfile

          apk = 'mobile_build/build/app/outputs/flutter-apk/app-release.apk'
          channel_forms = [b'macradar_dropping_live_v2', 'macradar_dropping_live_v2'.encode('utf-16le')]
          sound_forms = [b'dropping_alert', 'dropping_alert'.encode('utf-16le')]

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              channel_found = False
              sound_ref_found = False
              wav_matches = []

              for name in names:
                  try:
                      data = z.read(name)
                  except Exception:
                      continue

                  if any(value in data for value in channel_forms):
                      channel_found = True
                  if any(value in data for value in sound_forms):
                      sound_ref_found = True

                  if data.startswith(b'RIFF') and b'WAVE' in data[:16]:
                      try:
                          with wave.open(io.BytesIO(data), 'rb') as wav:
                              channels = wav.getnchannels()
                              rate = wav.getframerate()
                              seconds = wav.getnframes() / rate
                              print('APK_WAV entry=' + name + ' channels=' + str(channels) + ' rate=' + str(rate) + ' seconds=' + format(seconds, '.2f'))
                              if channels == 1 and rate == 44100 and 1.25 <= seconds <= 1.40:
                                  wav_matches.append((name, seconds))
                      except wave.Error:
                          pass

              print('APK_CHANNEL_STRING=' + ('FOUND' if channel_found else 'MISSING'))
              print('APK_SOUND_REF_STRING=' + ('FOUND' if sound_ref_found else 'MISSING'))

              errors = []
              if not wav_matches:
                  errors.append('Dedicated Dropping WAV payload is missing from APK')
              if not channel_found:
                  errors.append('Dropping notification channel id is missing from APK binary')
              if not sound_ref_found:
                  errors.append('Dropping sound reference is missing from APK binary')
              for message in errors:
                  print('::error file=.github/workflows/build-apk.yml,line=187::' + message)
              if errors:
                  raise SystemExit(' | '.join(errors))

              print('APK_DROPPING_SOUND=OK entry=' + wav_matches[0][0] + ' seconds=' + format(wav_matches[0][1], '.2f'))
              print('APK_DROPPING_CHANNEL=OK id=macradar_dropping_live_v2')
          PYVERIFY

      - name: Prepare APK
        run: |
          cp mobile_build/build/app/outputs/flutter-apk/app-release.apk MacRadar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MacRadar-APK
          path: MacRadar.apk
          retention-days: 30
