name: FotMob H2H Probe

on:
  push:
    paths:
      - '.github/workflows/h2h-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe matchup H2H
        shell: bash
        run: |
          node - <<'NODE'
          const H={
            'user-agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/149 Mobile Safari/537.36',
            'accept':'application/json,text/plain,*/*',
            'referer':'https://www.fotmob.com/'
          };
          async function j(url){
            const r=await fetch(url,{headers:H});
            const t=await r.text();
            console.log('HTTP',r.status,url);
            if(!r.ok) throw new Error(t.slice(0,500));
            return JSON.parse(t);
          }
          function walk(o,path='root',cb){
            if(!o||typeof o!=='object') return;
            cb(o,path);
            if(Array.isArray(o)) o.forEach((v,i)=>walk(v,path+'['+i+']',cb));
            else for(const [k,v] of Object.entries(o)) if(v&&typeof v==='object') walk(v,path+'.'+k,cb);
          }
          const q='Bayer Leverkusen RB Leipzig';
          const search=await j('https://www.fotmob.com/api/data/search/suggest?hits=30&lang=en&term='+encodeURIComponent(q));
          const matches=[];
          walk(search,'root',(o,p)=>{
            if(o?.type==='match') matches.push({...o,path:p});
          });
          console.log('MATCHES',JSON.stringify(matches,null,2));
          const target=matches.find(m=>
            /lever/i.test(String(m.homeTeamName||m.awayTeamName||'')) &&
            /leip/i.test(String(m.homeTeamName||m.awayTeamName||''))
          ) || matches[0];
          if(!target) throw new Error('no target match');
          const md=await j('https://www.fotmob.com/api/data/matchDetails?matchId='+target.id);
          const hits=[];
          walk(md,'root',(o,p)=>{
            const ps=p.toLowerCase();
            const keys=Object.keys(o||{}).join(' ').toLowerCase();
            if(/h2h|head.to.head|previousmeet|lastmeet|form/.test(ps+' '+keys)){
              hits.push({path:p,obj:o});
            }
          });
          console.log('HITS',JSON.stringify(hits.slice(0,80)).slice(0,25000));
          NODE
