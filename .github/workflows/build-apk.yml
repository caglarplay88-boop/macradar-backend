name: Build MacRadar APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.macradar --project-name macradar mobile_build
          cp mobile/lib/main.dart mobile_build/lib/main.dart
          cd mobile_build
          flutter pub add http shared_preferences flutter_local_notifications workmanager

      - name: Set app name and internet permission
        run: |
          sed -i 's/android:label="macradar"/android:label="MacRadar"/' mobile_build/android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/macradar_icon"#' mobile_build/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' mobile_build/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' mobile_build/android/app/src/main/AndroidManifest.xml
          mkdir -p mobile_build/android/app/src/main/res/drawable
          cat > mobile_build/android/app/src/main/res/drawable/macradar_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#13231A"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFC857"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M16,72 L36,51 L51,62 L73,37 L90,49" />
              <path
                  android:fillColor="#FFC857"
                  android:pathData="M84,33 L95,45 L79,45z" />
              <path
                  android:fillColor="#F2F5F3"
                  android:pathData="M78,69 m-16,0 a16,16 0,1 0,32,0 a16,16 0,1 0,-32,0" />
              <path
                  android:fillColor="#13231A"
                  android:pathData="M78,59 L86,65 L83,74 L73,74 L70,65z" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#13231A"
                  android:strokeWidth="3"
                  android:pathData="M70,65 L64,60 M86,65 L92,60 M73,74 L69,82 M83,74 L87,82" />
          </vector>
          EOF
          sed -i '/sourceCompatibility = JavaVersion./a\        isCoreLibraryDesugaringEnabled = true' mobile_build/android/app/build.gradle.kts
          cat >> mobile_build/android/app/build.gradle.kts <<'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          EOF

      - name: Build release APK
        run: |
          cd mobile_build
          flutter build apk --release

      - name: Prepare APK
        run: |
          cp mobile_build/build/app/outputs/flutter-apk/app-release.apk MacRadar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MacRadar-APK
          path: MacRadar.apk
          retention-days: 30
