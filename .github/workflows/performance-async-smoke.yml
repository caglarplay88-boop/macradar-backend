name: Async Performance Smoke

on:
  push:
    paths:
      - '.github/workflows/performance-async-smoke.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test cached async performance endpoint
        shell: bash
        run: |
          node - <<'NODE'
          const eventId = '4dYNZG4l';
          const base =
            'https://macradar-backend.onrender.com/api/matches/' +
            eventId +
            '/performance';

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function call(method, body) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 25000);
            try {
              const r = await fetch(base, {
                method,
                signal: controller.signal,
                headers: method === 'POST'
                  ? {
                      'content-type': 'application/json',
                      'x-api-key': '68427531',
                    }
                  : {},
                body: body ? JSON.stringify(body) : undefined,
              });

              let data = {};
              try {
                data = await r.json();
              } catch {}

              return { status: r.status, data };
            } finally {
              clearTimeout(timer);
            }
          }

          function validate(x) {
            if (!x?.evTakimi || !x?.deplasmanTakimi) {
              throw new Error('Performance payload has no teams');
            }

            console.log(
              'READY',
              x.evTakimi.takim,
              'vs',
              x.deplasmanTakimi.takim
            );
            console.log(
              'xG/xGA',
              x.evTakimi.son10?.xG,
              x.evTakimi.son10?.xGA,
              '|',
              x.deplasmanTakimi.son10?.xG,
              x.deplasmanTakimi.son10?.xGA
            );
            console.log(
              'league',
              x.evTakimi.ligDurumu?.sira,
              x.deplasmanTakimi.ligDurumu?.sira
            );
            console.log(
              'missing',
              x.evTakimi.eksikler?.length,
              x.deplasmanTakimi.eksikler?.length
            );
            console.log('h2h', x.h2h?.bulunan);
          }

          (async () => {
            const trigger = await call('POST', { force: true });
            console.log('TRIGGER', trigger.status, trigger.data.status);

            if (![200, 202].includes(trigger.status)) {
              console.error(trigger.data);
              process.exit(1);
            }

            if (trigger.status === 200) {
              validate(trigger.data);
            } else {
              let ready = null;

              for (let i = 1; i <= 50; i++) {
                await sleep(4000);
                const poll = await call('GET');
                console.log('POLL', i, poll.status, poll.data.status || '');

                if (poll.status === 200) {
                  ready = poll.data;
                  break;
                }

                if (poll.status === 503) {
                  console.error(poll.data);
                  process.exit(1);
                }
              }

              if (!ready) {
                throw new Error('Performance did not become ready in time');
              }

              validate(ready);
            }

            const t0 = Date.now();
            const cached = await call('GET');
            const elapsed = Date.now() - t0;

            if (cached.status !== 200) {
              console.error(cached);
              throw new Error('Cached second read did not return 200');
            }

            validate(cached.data);
            console.log('SECOND_READ_MS', elapsed);
            console.log(
              'CACHE',
              JSON.stringify(cached.data.performance_cache || {})
            );
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
